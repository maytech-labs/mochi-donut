[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Trammel May"]
repository = "https://github.com/trammel-may/mochi-donut"
homepage = "https://github.com/trammel-may/mochi-donut"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Small and fast: measured in docs/decisions/0009-release-profile.md.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
