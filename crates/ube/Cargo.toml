[package]
name = "mochi-ube"
description = "ube: the change in hand. Which checks apply to it, whether they passed on this exact code, what failed, and whether its tests can fail."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["agents", "cli", "testing", "ci", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ube"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
mochi-common = { version = "0.0.0", path = "../common" }
mochi-index = { version = "0.0.0", path = "../index" }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.154"
tempfile = "3.27.0"
