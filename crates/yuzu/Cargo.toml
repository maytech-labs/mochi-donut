[package]
name = "mochi-yuzu"
description = "yuzu: what your environment is. Classifies and gates the targets a command will touch, and checks services from where you are."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["agents", "cli", "kubernetes", "safety", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "yuzu"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
mochi-common = { version = "0.1.0", path = "../common" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.154"
tempfile = "3.27.0"
