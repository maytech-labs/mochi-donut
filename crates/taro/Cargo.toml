[package]
name = "mochi-taro"
description = "taro: the forge and the team. Whether a PR can merge and why not, open review threads, owners, flaky checks, and branches proved merged."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["agents", "cli", "github", "code-review", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "taro"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
mochi-common = { version = "0.1.0", path = "../common" }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.154"
tempfile = "3.27.0"
